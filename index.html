const SYNS = {
  "mælk":["mælk","letmælk","skummetmælk","minimælk","sødmælk","kefir"],
  "æg":["æg"],"smør":["smør","smørbar","lurpak"],

  "yoghurt":["yoghurt","skyr","ymer"],"pasta":["pasta","spaghetti","penne"]
};
function scoreSearch(deal,tokens){
  if(!tokens.length)return 1;
  const hay=[deal.name,deal.desc||"",deal.store,deal.cat||""].join(" ").toLowerCase().split(/[\s,\-\/]+/);
  let tot=0;
  for(const t of tokens){
    const syns=SYNS[t]||[t]; let best=0;
    for(const s of syns)for(const w of hay){
      if(w===s)best=Math.max(best,3);
      else if(w.startsWith(s))best=Math.max(best,2);
      else if(s.length>=3&&w.endsWith(s)&&w!==s)best=Math.max(best,1.5);
    }
    if(deal.store.toLowerCase()===t)best=Math.max(best,3);
    if(best===0)return 0;
    tot+=best;
  }
  return tot;
}

  const toks=state.search.toLowerCase().trim().split(/\s+/).filter(t=>t.length>1);

    .filter(d=>state.store==="Alle"||d.store===state.store)
    .filter(d=>state.cat==="Alle"||d.cat===state.cat)
    .filter(d=>!state.search||scoreSearch(d,toks)>0)
    .sort((a,b)=>{
      if(state.sort==="savings")return (b.savings||0)-(a.savings||0);
      if(state.sort==="price")return a.price-b.price;
      if(state.sort==="pct"){const pa=a.origPrice?(a.origPrice-a.price)/a.origPrice:0;const pb=b.origPrice?(b.origPrice-b.price)/b.origPrice:0;return pb-pa;}
      return a.name.localeCompare(b.name,"da");
    });
}

          + items.map(deal=>'<div class="cart-item"><span style="font-size:18px;flex-shrink:0">'+(deal.emoji||"🛒")+'</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(deal.name)+'</div><div style="font-size:10px;color:#8a9e8a">'+fmt(deal.price)+' pr. stk</div></div><div style="display:flex;align-items:center;flex-shrink:0"><button style="width:28px;height:28px;border-radius:6px 0 0 6px;border:1px solid #e0e8e0;border-right:none;background:#fff;cursor:pointer;color:#2a7d2e;font-weight:700;font-size:16px" data-cart-id="'+deal.id+'" data-cart-delta="-1">−</button><div style="width:30px;height:28px;border:1px solid #e0e8e0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">'+deal.qty+'</div><button style="width:28px;height:28px;border-radius:0 6px 6px 0;border:1px solid #2a7d2e;background:#2a7d2e;cursor:pointer;color:#fff;font-weight:700;font-size:16px" data-cart-id="'+deal.id+'" data-cart-delta="1">+</button></div><div style="font-size:13px;font-weight:700;color:#2a7d2e;flex-shrink:0;min-width:52px;text-align:right">'+fmt(deal.price*deal.qty)+'</div><button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:4px" data-cart-remove="'+deal.id+'">✕</button></div>').join("")

<script>
// ════════════════════════════════════════════════════════════════
// BIND CUSTOMER
// ════════════════════════════════════════════════════════════════
let searchTimer=null, logoClicks=0, logoTimer=null;
 
function bindCustomer(){
  const logoBtn=document.getElementById("logoBtn");
  if(logoBtn){
    logoBtn.onclick=()=>{
      logoClicks++;
      clearTimeout(logoTimer);
      logoTimer=setTimeout(()=>{logoClicks=0;},2000);
      if(logoClicks>=ADMIN_TAP_COUNT){
        logoClicks=0; clearTimeout(logoTimer);
        state.page=isAdminLoggedIn()?"admin":"admin-login";
        render();
      }
    };
  }
  const si=document.getElementById("searchInput");
  if(si){
    si.addEventListener("input",e=>{
      state.input=e.target.value;
      clearTimeout(searchTimer);
      if(!state.input){state.search="";state.suggs=[];render();placeCaret();return;}
      searchTimer=setTimeout(()=>{
        state.search=state.input;
        const toks=state.input.toLowerCase().trim().split(/\s+/).filter(t=>t.length>1);
        const seen=new Set(),res=[];
        for(const d of state.deals){
          if(scoreSearch(d,toks)>0){
            const lbl=d.name.split(" ").slice(0,3).join(" ");
            if(!seen.has(lbl)){seen.add(lbl);res.push({label:lbl,store:d.store});}
            if(res.length>=5)break;
          }
        }
        state.suggs=res; render(); placeCaret();
      },180);
    });
    si.addEventListener("keydown",e=>{ if(e.key==="Escape"){state.input="";state.search="";state.suggs=[];render();} });
  }
  function placeCaret(){
    const el=document.getElementById("searchInput");
    if(el){ el.focus(); const v=el.value; el.value=""; el.value=v; }
  }
  const sc=document.getElementById("searchClear");
  if(sc)sc.onclick=()=>{state.input="";state.search="";state.suggs=[];render();};
  document.querySelectorAll(".sugg-item").forEach(el=>{
    el.onmousedown=()=>{state.input=el.dataset.label;state.search=el.dataset.label;state.suggs=[];render();};
  });
  document.querySelectorAll("[data-store]").forEach(el=>{ el.onclick=()=>{state.store=el.dataset.store;render();}; });
  document.querySelectorAll("[data-cat]").forEach(el=>{ el.onclick=()=>{state.cat=el.dataset.cat;render();}; });
  const ss=document.getElementById("sortSelect");
  if(ss)ss.onchange=e=>{state.sort=e.target.value;render();};
  document.querySelectorAll("[data-delta]").forEach(btn=>{ btn.onclick=()=>cartUpdate(btn.dataset.id,parseInt(btn.dataset.delta)); });
  const cartBtn=document.getElementById("cartBtn");
  if(cartBtn)cartBtn.onclick=()=>{state.cartOpen=true;render();};
  const cartOverlay=document.getElementById("cartOverlay");
  if(cartOverlay)cartOverlay.onclick=()=>{state.cartOpen=false;render();};
  const cartClose=document.getElementById("cartClose");
  if(cartClose)cartClose.onclick=()=>{state.cartOpen=false;render();};
  const cartClear=document.getElementById("cartClear");
  if(cartClear)cartClear.onclick=()=>{state.cart=[];render();};
  document.querySelectorAll("[data-cart-id]").forEach(btn=>{ btn.onclick=()=>cartUpdate(btn.dataset.cartId,parseInt(btn.dataset.cartDelta)); });
  document.querySelectorAll("[data-cart-remove]").forEach(btn=>{ btn.onclick=()=>{state.cart=state.cart.filter(d=>d.id!==btn.dataset.cartRemove);render();}; });
  const mealBtn=document.getElementById("mealBtn");
  if(mealBtn)mealBtn.onclick=()=>{state.page="meals";render();};
  bindAdBanner();
}
 
function cartUpdate(id,delta){
  const ex=state.cart.find(d=>d.id===id);
  if(!ex){
    if(delta>0){ const deal=state.deals.find(d=>d.id===id); if(deal)state.cart.push(Object.assign({},deal,{qty:1})); }
  }else{
    const q=ex.qty+delta;
    if(q<=0)state.cart=state.cart.filter(d=>d.id!==id);
    else state.cart=state.cart.map(d=>d.id===id?Object.assign({},d,{qty:q}):d);
  }
  render();
}
 
function bindAdBanner(){
  const el=document.getElementById("adScroll");
  if(!el)return;
  let drag=false,sx=0,sl=0;
  el.onmousedown=e=>{drag=true;sx=e.clientX;sl=el.scrollLeft;};
  el.onmousemove=e=>{if(drag)el.scrollLeft=sl-(e.clientX-sx);};
  el.onmouseup=()=>{drag=false;};
  el.onmouseleave=()=>{drag=false;};
  el.ontouchstart=e=>{sx=e.touches[0].clientX;sl=el.scrollLeft;};
  el.ontouchmove=e=>{el.scrollLeft=sl-(e.touches[0].clientX-sx);};
}
 
// ════════════════════════════════════════════════════════════════
// UGENS RETTER

function cheapestStore(meal){
  const t={};
  for(const i of meal.ingredients)if(i.onSale&&i.store)t[i.store]=(t[i.store]||0)+(i.price||0);
  const e=Object.entries(t);
  return e.length?e.sort((a,b)=>a[1]-b[1])[0][0]:null;
}
function storeCost(meal,s){ return meal.ingredients.filter(i=>i.store===s).reduce((sum,i)=>sum+(i.price||0),0); }
 
async function generateMeals(){
  state.mealsLoading=true; state.meals=[]; state.mealSelected=null; state.mealMode=null; render();
  const src=state.deals.length>0?state.deals:DEMO;
  const summary=src.slice(0,50).map(d=>d.name+" ("+d.store+", "+d.price+" kr, "+(d.unit||"")+")").join("\n");
  try{
    const text=await callAI([{role:"user",content:"Lav 5 billige hverdagsretter baseret på disse tilbud:\n"+summary+"\n\nSvar KUN med JSON array, ingen backticks:\n[{\"title\":\"Navn\",\"emoji\":\"🍗\",\"desc\":\"1 sætning\",\"time\":\"30 min\",\"portions\":4,\"totalPrice\":65,\"ingredients\":[{\"name\":\"Kyllingefilet\",\"amount\":\"400 g\",\"store\":\"Rema 1000\",\"price\":20,\"onSale\":true},{\"name\":\"Fløde\",\"amount\":\"2 dl\",\"store\":null,\"price\":9,\"onSale\":false}],\"steps\":[\"Trin 1\",\"Trin 2\"]}]"}]);
    state.meals=extractJSON(text);
  }catch(e){ state.meals=FB_MEALS; }
  state.mealsLoading=false; render();
}

function bindMeals(){
  const back=document.getElementById("mealsBack");
  if(back)back.onclick=()=>{state.page="customer";render();};
  const gen=document.getElementById("mealsGen");
  if(gen)gen.onclick=()=>{if(!state.mealsLoading)generateMeals();};
  const start=document.getElementById("mealsStart");
  if(start)start.onclick=()=>generateMeals();
  document.querySelectorAll("[data-meal]").forEach(el=>{ el.onclick=()=>{state.mealSelected=state.meals[parseInt(el.dataset.meal)];state.mealMode=null;render();}; });
  const detailBack=document.getElementById("mealDetailBack");
  if(detailBack)detailBack.onclick=()=>{state.mealSelected=null;state.mealMode=null;render();};
  document.querySelectorAll(".mode-btn").forEach(btn=>{ btn.onclick=()=>{state.mealMode=btn.dataset.mode;render();}; });
  const addBtn=document.getElementById("addMealToCart");
  if(addBtn)addBtn.onclick=()=>{
    if(!state.mealMode)return;
    const meal=state.mealSelected;
    const target=state.mealMode==="cheapest"?cheapestStore(meal):state.mealMode;
    const items=meal.ingredients.filter(ing=>target?(ing.onSale&&ing.store===target):ing.onSale).map(ing=>({id:"m-"+ing.name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),name:ing.name,store:ing.store||"Ukendt",price:ing.price||0,unit:ing.amount||"",emoji:"🛒",cat:"Andet",savings:0,qty:1}));
    for(const item of items){
      const ex=state.cart.find(d=>d.id===item.id);
      if(ex)state.cart=state.cart.map(d=>d.id===item.id?Object.assign({},d,{qty:d.qty+1}):d);
      else state.cart.push(item);
    }
    state.page="customer"; state.mealSelected=null; state.mealMode=null; state.cartOpen=true; render();
  };
}

function bindAdminLogin(){
  const pw=document.getElementById("loginPw");
  const btn=document.getElementById("loginBtn");
  const err=document.getElementById("loginErr");
  const toggle=document.getElementById("togglePw");
  if(toggle)toggle.onclick=()=>{ pw.type=pw.type==="password"?"text":"password"; toggle.textContent=pw.type==="password"?"👁":"🙈"; };
  const doLogin=()=>{
    if(pw.value===ADMIN_PW){ sessionStorage.setItem("th_admin","1"); state.page="admin"; render(); }
    else{ err.textContent="Forkert adgangskode. Prøv igen."; err.style.display="block"; pw.value=""; }
  };
  if(btn)btn.onclick=doLogin;
  if(pw)pw.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}

function bindMeals(){
  const back=document.getElementById("mealsBack");
  if(back)back.onclick=()=>{state.page="customer";render();};
  const gen=document.getElementById("mealsGen");
  if(gen)gen.onclick=()=>{if(!state.mealsLoading)generateMeals();};
  const start=document.getElementById("mealsStart");
  if(start)start.onclick=()=>generateMeals();
  document.querySelectorAll("[data-meal]").forEach(el=>{ el.onclick=()=>{state.mealSelected=state.meals[parseInt(el.dataset.meal)];state.mealMode=null;render();}; });
  const detailBack=document.getElementById("mealDetailBack");
  if(detailBack)detailBack.onclick=()=>{state.mealSelected=null;state.mealMode=null;render();};
  document.querySelectorAll(".mode-btn").forEach(btn=>{ btn.onclick=()=>{state.mealMode=btn.dataset.mode;render();}; });
  const addBtn=document.getElementById("addMealToCart");
  if(addBtn)addBtn.onclick=()=>{
    if(!state.mealMode)return;
    const meal=state.mealSelected;
    const target=state.mealMode==="cheapest"?cheapestStore(meal):state.mealMode;
    const items=meal.ingredients.filter(ing=>target?(ing.onSale&&ing.store===target):ing.onSale).map(ing=>({id:"m-"+ing.name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),name:ing.name,store:ing.store||"Ukendt",price:ing.price||0,unit:ing.amount||"",emoji:"🛒",cat:"Andet",savings:0,qty:1}));
    for(const item of items){
      const ex=state.cart.find(d=>d.id===item.id);
      if(ex)state.cart=state.cart.map(d=>d.id===item.id?Object.assign({},d,{qty:d.qty+1}):d);
      else state.cart.push(item);
    }
    state.page="customer"; state.mealSelected=null; state.mealMode=null; state.cartOpen=true; render();
  };
}

function addLog(msg,type){ state.adminLog=[{msg,type:type||"info"}].concat(state.adminLog).slice(0,15); }

function stampDeals(items,store){
  return items.map((d,i)=>({
    id:store+"-"+Date.now()+"-"+i, store:store,
    name:d.name||"Ukendt", desc:d.desc||"",
    price:Number(d.price)||0, origPrice:d.origPrice?Number(d.origPrice):null,
    unit:d.unit||"", unitPrice:d.unitPrice||"", savings:Number(d.savings)||0,
    cat:d.cat||"Andet", emoji:d.emoji||"🛒", qty:1
  }));
}

async function adminSaveDeals(newDeals){
  const meta={week_num:getWeek(),next_week:getWeek()+1,date_str:dkDate()};
  await SB.upsertDeals(newDeals,state.adminStore);
  await SB.upsertMeta(meta);
  const all=await SB.getDeals();
  if(all&&all.length>0){ state.adminSaved=all; state.deals=all; state.meta=meta; }
}

async function doAdminFile(){
  if(!state.adminFiles.length){addLog("Vælg en fil.","error");render();return;}
  if(!state.adminStore){addLog("Vælg butik.","error");render();return;}
  state.adminLoading=true;render();
  let allNew=[];
  for(const file of state.adminFiles){
    addLog("Analyserer "+file.name+"...");render();
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const isPdf=file.type==="application/pdf";
      const text=await callAI([{role:"user",content:[{type:isPdf?"document":"image",source:{type:"base64",media_type:file.type,data:b64}},{type:"text",text:AI_PROMPT(state.adminStore)}]}]);
      const items=stampDeals(extractJSON(text),state.adminStore);
      allNew=allNew.concat(items);
      addLog("✓ "+items.length+" tilbud fundet i "+file.name,"ok");
    }catch(e){ addLog("Fejl: "+e.message,"error"); }
  }
  if(allNew.length){ await adminSaveDeals(allNew); addLog("💾 "+allNew.length+" tilbud fra "+state.adminStore+" er LIVE for alle kunder!","ok"); }
  state.adminFiles=[]; state.adminLoading=false; render();
}

async function doAdminUrl(){
  if(!state.adminUrl.trim()){addLog("Indsæt et link.","error");render();return;}
  if(!state.adminStore){addLog("Vælg butik.","error");render();return;}
  state.adminLoading=true; addLog("Søger tilbud fra "+state.adminStore+"...");render();
  try{
    const body={model:"claude-sonnet-4-20250514",max_tokens:1000,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:"Find alle aktuelle tilbud fra \""+state.adminStore+"\" på: "+state.adminUrl.trim()+"\n\n"+AI_PROMPT(state.adminStore)}]};
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("API fejl "+r.status);
    const d=await r.json();
    const text=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(!text.trim())throw new Error("Linket kunne ikke læses. Upload avisen som billede i stedet.");
    const items=stampDeals(extractJSON(text),state.adminStore);
    await adminSaveDeals(items);
    addLog("✓ "+items.length+" tilbud fra "+state.adminStore+" er LIVE!","ok");
    state.adminUrl="";
  }catch(e){ addLog("Fejl: "+e.message,"error"); }
  state.adminLoading=false; render();
}

function bindAdmin(){
  const logout=document.getElementById("adminLogout");
  if(logout)logout.onclick=()=>{sessionStorage.removeItem("th_admin");state.page="customer";render();};
  const storeSelect=document.getElementById("adminStore");
  if(storeSelect)storeSelect.onchange=e=>{state.adminStore=e.target.value;render();};
  const modeFile=document.getElementById("modeFile");
  if(modeFile)modeFile.onclick=()=>{state.adminMode="file";render();};
  const modeUrl=document.getElementById("modeUrl");
  if(modeUrl)modeUrl.onclick=()=>{state.adminMode="url";render();};
  const fileDrop=document.getElementById("fileDrop");
  const fileInput=document.getElementById("fileInput");
  if(fileDrop&&fileInput){ fileDrop.onclick=()=>fileInput.click(); fileInput.onchange=e=>{state.adminFiles=Array.from(e.target.files);render();}; }
  const urlInput=document.getElementById("urlInput");
  if(urlInput)urlInput.oninput=e=>{state.adminUrl=e.target.value;};
  const analyse=document.getElementById("adminAnalyse");
  if(analyse)analyse.onclick=()=>{ if(!state.adminLoading){ state.adminMode==="url"?doAdminUrl():doAdminFile(); } };
  document.querySelectorAll(".del-store-btn").forEach(btn=>{
    btn.onclick=async()=>{
      await SB.deleteStore(btn.dataset.store);
      const all=await SB.getDeals();
      state.adminSaved=all||[];
      state.deals=all&&all.length>0?all:DEMO;
      addLog(btn.dataset.store+" slettet.");
      render();
    };
  });
}

// ════════════════════════════════════════════════════════════════
async function init(){
  state.loading=true; render();
  try{
    const results=await Promise.all([SB.getDeals(),SB.getMeta()]);
    const deals=results[0], meta=results[1];
    state.deals=(deals&&deals.length>0)?deals:DEMO;
    state.meta=meta;
    state.adminSaved=(deals&&deals.length>0)?deals:[];
  }catch(e){ state.deals=DEMO; }
  state.loading=false; render();
}
init();
