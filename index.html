function score(deal,toks){
  if(!toks.length)return 1;
  const hay=[deal.name,deal.desc||"",deal.store,deal.cat||""].join(" ").toLowerCase().split(/[\s,\-\/]+/);
  let tot=0;
  for(const t of toks){
    const syns=SYNS[t]||[t];let best=0;
    for(const s of syns)for(const w of hay){if(w===s)best=Math.max(best,3);else if(w.startsWith(s))best=Math.max(best,2);else if(s.length>=3&&w.endsWith(s)&&w!==s)best=Math.max(best,1.5);}
    if(deal.store.toLowerCase()===t)best=Math.max(best,3);
    if(best===0)return 0;
    tot+=best;
  }
  return tot;
}

  return S.deals
    .filter(d=>S.storeF==="Alle"||d.store===S.storeF)
    .filter(d=>S.catF==="Alle"||d.cat===S.catF)
    .filter(d=>!S.search||score(d,toks)>0)
    .sort((a,b)=>{
      if(S.sort==="savings")return(b.savings||0)-(a.savings||0);
      if(S.sort==="price")return a.price-b.price;
      if(S.sort==="pct"){const pa=a.origPrice?(a.origPrice-a.price)/a.origPrice:0,pb=b.origPrice?(b.origPrice-b.price)/b.origPrice:0;return pb-pa;}
      return a.name.localeCompare(b.name,"da");
    });
}

let sTimer=null,lClicks=0,lTimer=null;

function bindCustomer(){
  const logo=document.getElementById("logo");
  if(logo)logo.onclick=()=>{
    lClicks++;clearTimeout(lTimer);
    lTimer=setTimeout(()=>{lClicks=0;},2000);
    if(lClicks>=LOGO_TAPS){lClicks=0;clearTimeout(lTimer);S.page=isAdmin()?"admin":"login";R();}
  };

  const si=document.getElementById("si");
  if(si){
    si.addEventListener("input",e=>{
      S.input=e.target.value;clearTimeout(sTimer);
      if(!S.input){S.search="";S.suggs=[];R();refocus();return;}
      sTimer=setTimeout(()=>{
        S.search=S.input;
        const toks=S.input.toLowerCase().trim().split(/\s+/).filter(t=>t.length>1);
        const seen=new Set(),res=[];
        for(const d of S.deals){if(score(d,toks)>0){const l=d.name.split(" ").slice(0,3).join(" ");if(!seen.has(l)){seen.add(l);res.push({label:l,store:d.store});}if(res.length>=5)break;}}
        S.suggs=res;R();refocus();
      },180);
    });
    si.addEventListener("keydown",e=>{if(e.key==="Escape"){S.input="";S.search="";S.suggs=[];R();}});
  }
  function refocus(){const el=document.getElementById("si");if(el){el.focus();const v=el.value;el.value="";el.value=v;}}

  const sx=document.getElementById("sx");
  if(sx)sx.onclick=()=>{S.input="";S.search="";S.suggs=[];R();};

  document.querySelectorAll(".si2").forEach(el=>{el.onmousedown=()=>{S.input=el.dataset.lbl;S.search=el.dataset.lbl;S.suggs=[];R();};});
  document.querySelectorAll("[data-store]").forEach(el=>{el.onclick=()=>{S.storeF=el.dataset.store;R();};});
  document.querySelectorAll("[data-cat]").forEach(el=>{el.onclick=()=>{S.catF=el.dataset.cat;R();};});
  const ss=document.getElementById("ss");if(ss)ss.onchange=e=>{S.sort=e.target.value;R();};
  document.querySelectorAll("[data-delta]").forEach(b=>{b.onclick=()=>cartUpd(b.dataset.id,parseInt(b.dataset.delta));});
  const cb=document.getElementById("cartBtn");if(cb)cb.onclick=()=>{S.cartOpen=true;R();};
  const cov=document.getElementById("cov");if(cov)cov.onclick=()=>{S.cartOpen=false;R();};
  const cc=document.getElementById("cc");if(cc)cc.onclick=()=>{S.cartOpen=false;R();};
  const clr=document.getElementById("clr");if(clr)clr.onclick=()=>{S.cart=[];R();};
  document.querySelectorAll("[data-cid]").forEach(b=>{b.onclick=()=>cartUpd(b.dataset.cid,parseInt(b.dataset.cd));});
  document.querySelectorAll("[data-cr]").forEach(b=>{b.onclick=()=>{S.cart=S.cart.filter(d=>d.id!==b.dataset.cr);R();};});
  const mb=document.getElementById("mealBtn");if(mb)mb.onclick=()=>{S.page="meals";R();};
  bindAd();
}

function cartUpd(id,delta){
  const ex=S.cart.find(d=>d.id===id);
  if(!ex){if(delta>0){const d=S.deals.find(d=>d.id===id);if(d)S.cart.push(Object.assign({},d,{qty:1}));}}
  else{const q=ex.qty+delta;if(q<=0)S.cart=S.cart.filter(d=>d.id!==id);else S.cart=S.cart.map(d=>d.id===id?Object.assign({},d,{qty:q}):d);}
  R();
}

function bindAd(){
  const el=document.getElementById("adsc");if(!el)return;
  let drag=false,sx=0,sl=0;
  el.onmousedown=e=>{drag=true;sx=e.clientX;sl=el.scrollLeft;};
  el.onmousemove=e=>{if(drag)el.scrollLeft=sl-(e.clientX-sx);};
  el.onmouseup=el.onmouseleave=()=>{drag=false;};
  el.ontouchstart=e=>{sx=e.touches[0].clientX;sl=el.scrollLeft;};
  el.ontouchmove=e=>{el.scrollLeft=sl-(e.touches[0].clientX-sx);};
}

function bindMeals(){
  const mb=document.getElementById("mb");if(mb)mb.onclick=()=>{S.page="customer";R();};
  const mg=document.getElementById("mg");if(mg)mg.onclick=()=>{if(!S.mLoading)genMeals();};
  const ms=document.getElementById("ms");if(ms)ms.onclick=()=>genMeals();
  document.querySelectorAll("[data-mi]").forEach(el=>{el.onclick=()=>{S.mSel=S.meals[parseInt(el.dataset.mi)];S.mMode=null;R();};});
  const mdb=document.getElementById("mdb");if(mdb)mdb.onclick=()=>{S.mSel=null;S.mMode=null;R();};
  document.querySelectorAll(".mmode").forEach(b=>{b.onclick=()=>{S.mMode=b.dataset.mode;R();};});
  const mac=document.getElementById("mac");
  if(mac)mac.onclick=()=>{
    if(!S.mMode)return;
    const m=S.mSel;const tgt=S.mMode==="cheapest"?cheapest(m):S.mMode;
    const items=m.ingredients.filter(i=>tgt?(i.onSale&&i.store===tgt):i.onSale).map(i=>({id:"m-"+i.name+"-"+Date.now()+"-"+Math.random().toString(36).slice(2),name:i.name,store:i.store||"Ukendt",price:i.price||0,unit:i.amount||"",emoji:"🛒",cat:"Andet",savings:0,qty:1}));
    for(const it of items){const ex=S.cart.find(d=>d.id===it.id);if(ex)S.cart=S.cart.map(d=>d.id===it.id?Object.assign({},d,{qty:d.qty+1}):d);else S.cart.push(it);}
    S.page="customer";S.mSel=null;S.mMode=null;S.cartOpen=true;R();
  };
}

async function doFile(){
  if(!S.aFiles.length){addLog("Vælg en fil.","error");R();return;}
  if(!S.aStore){addLog("Vælg butik.","error");R();return;}
  S.aLoading=true;R();let allNew=[];
  for(const f of S.aFiles){
    addLog("Analyserer "+f.name+"...");R();
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f);});
      const txt=await ai([{role:"user",content:[{type:f.type==="application/pdf"?"document":"image",source:{type:"base64",media_type:f.type,data:b64}},{type:"text",text:aiPrompt(S.aStore)}]}]);
      const items=stamp(extractJ(txt),S.aStore);allNew=allNew.concat(items);
      addLog("✓ "+items.length+" tilbud fundet","ok");
    }catch(e){addLog("Fejl: "+e.message,"error");}
  }
  if(allNew.length){await doSave(allNew);addLog("💾 "+allNew.length+" tilbud fra "+S.aStore+" er LIVE for alle kunder!","ok");}
  S.aFiles=[];S.aLoading=false;R();
}

async function doUrl(){
  if(!S.aUrl.trim()){addLog("Indsæt et link.","error");R();return;}
  if(!S.aStore){addLog("Vælg butik.","error");R();return;}
  S.aLoading=true;addLog("Søger tilbud fra "+S.aStore+"...");R();
  try{
    const body={model:"claude-sonnet-4-20250514",max_tokens:1000,tools:[{type:"web_search_20250305",name:"web_search"}],messages:[{role:"user",content:"Find alle tilbud fra \""+S.aStore+"\" på: "+S.aUrl.trim()+"\n\n"+aiPrompt(S.aStore)}]};
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error("API fejl "+r.status);
    const d=await r.json();
    const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    if(!txt.trim())throw new Error("Linket kunne ikke læses — upload avisen som billede i stedet.");
    const items=stamp(extractJ(txt),S.aStore);
    await doSave(items);addLog("✓ "+items.length+" tilbud fra "+S.aStore+" er LIVE!","ok");S.aUrl="";
  }catch(e){addLog("Fejl: "+e.message,"error");}
  S.aLoading=false;R();
}

async function doSave(deals){
  const meta={week_num:getWeek(),next_week:getWeek()+1,date_str:dkDate()};
  await sbSaveDeals(deals,S.aStore);
  await sbSaveMeta(meta);
  const all=await sbGetDeals();
  if(all&&all.length){S.aSaved=all;S.deals=all;S.meta=meta;}
}

function bindAdmin(){
  const alo=document.getElementById("alo");if(alo)alo.onclick=()=>{sessionStorage.removeItem("th_admin");S.page="customer";R();};
  const ast=document.getElementById("ast");if(ast)ast.onchange=e=>{S.aStore=e.target.value;R();};
  const amf=document.getElementById("amf");if(amf)amf.onclick=()=>{S.aMode="file";R();};
  const amu=document.getElementById("amu");if(amu)amu.onclick=()=>{S.aMode="url";R();};
  const afd=document.getElementById("afd"),afi=document.getElementById("afi");
  if(afd&&afi){afd.onclick=()=>afi.click();afi.onchange=e=>{S.aFiles=Array.from(e.target.files);R();};}
  const aui=document.getElementById("aui");if(aui)aui.oninput=e=>{S.aUrl=e.target.value;};
  const aan=document.getElementById("aan");if(aan)aan.onclick=()=>{if(!S.aLoading){S.aMode==="url"?doUrl():doFile();}};
  document.querySelectorAll(".adl").forEach(b=>{
    b.onclick=async()=>{
      await sbDelStore(b.dataset.s);
      const all=await sbGetDeals();
      S.aSaved=all||[];S.deals=all&&all.length?all:DEMO;
      addLog(b.dataset.s+" slettet.");R();
    };
  });
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
async function init(){
  S.loading=true;R();
  try{
    const[deals,meta]=await Promise.all([sbGetDeals(),sbGetMeta()]);
    S.deals=deals&&deals.length?deals:DEMO;
    S.meta=meta;
    S.aSaved=deals&&deals.length?deals:[];
  }catch{S.deals=DEMO;}
  S.loading=false;R();
}
init();
</script>
